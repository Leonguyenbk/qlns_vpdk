{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="badge-lg">NN</div>
    <h1>CSDL Nhân sự</h1>
    <p class="hint">Sở Nông nghiệp và Môi trường — hệ thống quản lý &amp; tra cứu sơ yếu lý lịch cán bộ, công chức.</p>
    <form method="POST">
      <div class="f-group">
        <label for="ten_dang_nhap">Tên đăng nhập</label>
        <input type="text" id="ten_dang_nhap" name="ten_dang_nhap" required autofocus>
      </div>
      <div class="f-group">
        <label for="mat_khau">Mật khẩu</label>
        <input type="password" id="mat_khau" name="mat_khau" required>
      </div>
      <button class="btn btn-primary" type="submit">Đăng nhập</button>
    </form>
    <div class="demo">Tài khoản mẫu: admin / admin123</div>
  </div>
</div>
{% endblock %}
