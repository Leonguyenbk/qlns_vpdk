services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-personnel_management}
      MYSQL_USER: ${MYSQL_USER:-hr_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-hr_user}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-personnel_management}?charset=utf8mb4
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      JWT_ACCESS_TOKEN_EXPIRES: "900"
      JWT_REFRESH_TOKEN_EXPIRES: "1209600"
      LOGIN_MAX_FAILED_ATTEMPTS: "5"
      LOGIN_LOCKOUT_MINUTES: "15"
      SEED_ON_START: ${SEED_ON_START:-true}
      CREATE_ADMIN_ON_START: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Quản trị hệ thống}
      # Tùy chọn: import "Phụ lục 4" lúc khởi động. Đặt file thật vào ./backend/data/
      # rồi set IMPORT_PHULUC4=/data/<tên file>.xlsx trong .env (mặc định: bỏ qua).
      IMPORT_PHULUC4: ${IMPORT_PHULUC4:-}
    volumes:
      - ./backend/data:/data
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
